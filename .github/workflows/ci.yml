name: CI

# Runs the checks that must pass before anything merges: lint, the type-check
# in isolation (so a tsconfig-only regression shows up even if build.yml's
# `tsc -b` output is stale), and the test suite. Separate from deploy.yml,
# which only ever runs on push to master and publishes — this workflow must
# never touch Pages, or it risks the same race a duplicate Pages workflow
# caused before.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npm test
